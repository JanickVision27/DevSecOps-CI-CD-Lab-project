version: 2.1

# DevSecOps CI/CD Lab - CircleCI pipeline
# Mirrors the GitHub Actions pipeline: Build & Test -> Trivy fs scan -> Docker build -> Trivy image scan
# (CodeQL stays in GitHub Actions - it is a GitHub-native product whose results live in the Security tab)
#
# Notes:
# - Uses only Docker executors so it runs on the CircleCI free plan
#   (the 'machine' executor requires a paid plan).
# - Hardened against Maven Central rate limiting (HTTP 429):
#   * the Maven cache (~/.m2) saved by build-and-test is restored before the
#     Trivy fs scan, so Trivy resolves dependencies locally instead of
#     flooding repo.maven.apache.org with requests
#   * scanning jobs run sequentially, not in parallel, so requests are
#     not compounded

jobs:
  # ---- Job 1: Build & Test (same as the GitHub Actions 'build' job) ----
  build-and-test:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Build and test with Maven
          command: mvn -B package
      - save_cache:
          key: maven-deps-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      - store_test_results:
          path: target/surefire-reports

  # ---- Job 2: Trivy filesystem scan of source code ----
  # Runs on the JDK image and restores the Maven cache from the build job so
  # Trivy can resolve Maven dependencies from ~/.m2 instead of Maven Central.
  trivy-source-scan:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Verify Maven dependencies are cached locally
          command: mvn -B -q dependency:resolve
      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy-bin
      - run:
          name: Trivy fs scan (source code)
          command: /tmp/trivy-bin/trivy fs --exit-code 0 --format table .

  # ---- Job 3: Build Docker image, then scan it ----
  # Free-plan compatible: Docker executor + setup_remote_docker instead of a machine VM.
  docker-build-and-image-scan:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t devsecops-lab:latest .
      - run:
          name: Export image for scanning
          command: docker save -o /tmp/app-image.tar devsecops-lab:latest
      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - run:
          name: Trivy image scan (container)
          command: trivy image --input /tmp/app-image.tar --exit-code 0 --format table

workflows:
  devsecops-pipeline:
    jobs:
      - build-and-test
      - trivy-source-scan:
          requires:
            - build-and-test
      # Serialized after the fs scan so the two Trivy scans never hit
      # Maven Central at the same time (avoids compounding rate limits).
      - docker-build-and-image-scan:
          requires:
            - trivy-source-scan